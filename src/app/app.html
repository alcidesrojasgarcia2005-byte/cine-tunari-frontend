<a class="skip" href="#contenido">Saltar al contenido</a>

<app-header />

<main id="contenido">
  <router-outlet />
</main>

@if (content.sitio(); as sitio) {
  <footer class="footer">
    <div class="footer__inner container">
      <div>
        <p class="footer__brand display"><app-accent-title [texto]="sitio.nombre" /></p>
        @if (sitio.eslogan) {
          <p class="footer__tagline">{{ sitio.eslogan }}</p>
        }
      </div>
      <div class="footer__meta">
        @if (sitio.email) {
          <a class="link" [href]="'mailto:' + sitio.email">{{ sitio.email }}</a>
        }
        @if (content.seccion('pie').subtitulo) {
          <p>{{ content.seccion('pie').subtitulo }}</p>
        }
      </div>
    </div>
  </footer>
}

<app-chatbot />
